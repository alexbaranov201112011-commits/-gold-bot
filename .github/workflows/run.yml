import os, requests
from datetime import datetime
import yfinance as yf
import pandas as pd

BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

def send(text):
    url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
    requests.post(url, json={"chat_id": CHAT_ID, "text": text, "parse_mode": "HTML"}, timeout=15)

def get_gold_data():
    try:
        # Текущая цена
        r = requests.get("https://api.gold-api.com/price/XAU", timeout=10).json()
        price = float(r.get("price", 0))
        if price < 100: raise Exception()
    except:
        price = 4418.20

    # История для SMA20 через yfinance (фьючерс золота)
    try:
        gold = yf.Ticker("GC=F")
        hist = gold.history(period="1mo", interval="1h")
        sma20 = hist['Close'].rolling(20).mean().iloc[-1]
    except:
        sma20 = 4423.52 # fallback если yfinance не сработает

    return price, sma20

price, sma20 = get_gold_data()

# Сигнал
if price < sma20:
    signal = "🔴 <b>SELL 📉 ШОРТ</b>"
    trend = "Медвежий тренд"
else:
    signal = "🟢 <b>BUY 📈 ЛОНГ</b>"
    trend = "Бычий тренд"

now = datetime.now().strftime("%H:%M")

msg = f"""🏆 <b>GOLD XAUUSD</b>

💰 <b>${price:.2f}</b>
📊 <b>SMA20: ${sma20:.2f}</b>
🎯 {signal}
📈 {trend}

⏰ <b>Aktau | 24/7 ✅</b> {now}
"""

send(msg)
print(f"Sent: GOLD ${price:.2f} SMA20 ${sma20:.2f}")
